name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seedshop_template_e2e
          POSTGRES_USER: seedshop_template_e2e
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seedshop_template_e2e -d seedshop_template_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://seedshop_template_e2e:ci-postgres-password@127.0.0.1:5432/seedshop_template_e2e
      E2E_DATABASE_URL: postgresql://seedshop_template_e2e:ci-postgres-password@127.0.0.1:5432/seedshop_template_e2e
      SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      ADMIN_AUTH_SECRET: ci-admin-auth-secret-at-least-32-characters
      ORDER_ACCESS_SECRET: ci-order-access-secret-at-least-32-characters
      CRON_SECRET: ci-cron-secret
      YOOKASSA_SHOP_ID: ci-e2e-shop
      YOOKASSA_SECRET_KEY: ci-e2e-secret-key
      NEXT_PUBLIC_E2E_SKIP_PAYMENT_REDIRECT: "1"
      YOOKASSA_E2E_MOCK: "1"
      PRISMA_QUERY_LOGGING: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Run static checks and production build
        run: npm run check

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Run consent and ecommerce analytics tests
        run: npm run test:e2e -- tests/e2e/analytics.spec.ts
        env:
          E2E_ENABLE_ANALYTICS: "1"

      - name: Run standalone production smoke test
        run: npm run smoke:standalone

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  build-image:
    name: build production image
    if: vars.ENABLE_IMAGE_PUBLISH == '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Seedshop Template
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_YANDEX_METRICA_ID=${{ vars.NEXT_PUBLIC_YANDEX_METRICA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Save immutable image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          install -d "${RUNNER_TEMP}/production-image"
          printf '%s\n' "${IMAGE_DIGEST}" > "${RUNNER_TEMP}/production-image/digest"

      - name: Upload production image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-digest-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-image/digest
          if-no-files-found: error
          retention-days: 30
